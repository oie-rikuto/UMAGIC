[project]
name = "umagic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rikuto Oie", email = "ricky.big.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "lightgbm>=4.7.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
umagic = "umagic:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# D-053: 実データ（data/umagic.duckdb）を要するテスト。R-017 によりデータは
# コミットできないため CI では実行できない。手動で `pytest -m realdata`。
markers = [
    "realdata: 実データのDuckDBを要する。CIから除外し手動で実行する（D-053）",
]
