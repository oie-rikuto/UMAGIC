[project]
name = "umagic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rikuto Oie", email = "ricky.big.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "polars>=1.43.2",
]

[project.scripts]
umagic = "umagic:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
